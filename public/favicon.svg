<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Violet diamond (top-right) -->
  <rect x="214" y="80" width="170" height="170" rx="28"
        fill="#8b5cf6"
        transform="rotate(45 299 165)"
        opacity="0.95"/>

  <!-- Blue diamond (bottom-left) overlapping -->
  <rect x="128" y="194" width="170" height="170" rx="28"
        fill="#3b82f6"
        transform="rotate(45 213 279)"
        opacity="1"/>

  <!-- Subtle inner glow on blue -->
  <rect x="128" y="194" width="170" height="170" rx="28"
        fill="url(#blueGlow)"
        transform="rotate(45 213 279)"
        opacity="0.3"/>

  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>