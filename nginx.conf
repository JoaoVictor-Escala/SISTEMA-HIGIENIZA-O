server {
    listen 80;
    server_name vivarecuidadores.com.br www.vivarecuidadores.com.br higigestor.com www.higigestor.com;
    # Redireciona tudo para HTTPS
    return 301 https://$host$request_uri;
}

# --- VIVARE CUIDADORES ---
server {
    listen 443 ssl;
    server_name vivarecuidadores.com.br www.vivarecuidadores.com.br;

    client_max_body_size 50M;

    ssl_certificate     /etc/letsencrypt/live/vivarecuidadores.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivarecuidadores.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* (index\.html|sw\.js|workbox-.+\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

