# --- DEFAULT FALLBACK ---
server {
    listen 80 default_server;
    server_name _;
    return 444; # Drop the connection
}
server {
    listen 443 ssl default_server;
    server_name _;
    # Use higigestor as fallback for IP hits or unknown domains
    ssl_certificate     /etc/letsencrypt/live/higigestor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/higigestor.com/privkey.pem;
    return 444; # Drop the connection
}
